# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name turgidcat.space;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name turgidcat.space;

    # Let's Encrypt SSL 证书
    ssl_certificate /etc/letsencrypt/live/turgidcat.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turgidcat.space/privkey.pem;

    # 现代 SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/personal-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Redirect old labs URLs to projects
    location = /labs.html {
        return 301 /projects.html;
    }

    location /labs/ {
        return 301 /projects/;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    # Original PHP API (keep for other APIs)
    location /api/ {
        if (!-f $request_filename) {
            rewrite ^(/api/)(.*)$ /api/index.php?$2 last;
        }
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ =404;
    }

    # Alipro v2.1
    location = /projects/alipro/ {
        return 301 /projects/alipro/frontend/index.html;
    }

    location /projects/alipro/ {
        root /var/www/personal-site;
        index index.html;
        try_files $uri $uri/ /projects/alipro/frontend/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Alipro v2.1 API proxy
    location /projects/alipro/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }
}
